<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bgGlow" cx="50%" cy="20%" r="80%">
    <stop offset="0%"   stop-color="#1a0800"/>
    <stop offset="100%" stop-color="#06060f"/>
  </radialGradient>
  <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#ff5c00"/>
    <stop offset="100%" stop-color="#ff8c42"/>
  </linearGradient>
</defs>

<rect width="1080" height="1080" fill="url(#bgGlow)"/>
<rect x="0" y="0"    width="1080" height="10" fill="url(#orangeGrad)"/>
<rect x="0" y="1070" width="1080" height="10" fill="url(#orangeGrad)"/>

<!-- Grille décorative fond -->
<g stroke="#ffffff" stroke-width="0.5" opacity="0.03">
  <line x1="0" y1="270" x2="1080" y2="270"/>
  <line x1="0" y1="540" x2="1080" y2="540"/>
  <line x1="0" y1="810" x2="1080" y2="810"/>
  <line x1="270" y1="0" x2="270" y2="1080"/>
  <line x1="540" y1="0" x2="540" y2="1080"/>
  <line x1="810" y1="0" x2="810" y2="1080"/>
</g>

<!-- Logo -->
<text x="54" y="68" font-family="Arial Black,Impact,sans-serif" font-size="32" font-weight="900"
  fill="#ff5c00" letter-spacing="4">HOOP IQ</text>
<text x="1026" y="68" font-family="Arial,sans-serif" font-size="20" font-weight="700"
  text-anchor="end" fill="#6b6b88">@hoopiq_officiel</text>

<!-- Ballon décoratif -->
<circle cx="540" cy="180" r="70" fill="none" stroke="#ff5c00" stroke-width="2" opacity="0.15"/>
<text x="540" y="202" font-family="Arial,sans-serif" font-size="72" text-anchor="middle">🏀</text>

<!-- Date -->
<text x="540" y="310" font-family="Arial,sans-serif" font-size="22"
  text-anchor="middle" fill="#6b6b88" letter-spacing="2">{{DATE}}</text>

<!-- Titre choc -->
<text x="540" y="408" font-family="Arial Black,Impact,sans-serif" font-size="76" font-weight="900"
  text-anchor="middle" fill="#f0f0ff" letter-spacing="2">{{TITLE}}</text>

<!-- Ligne -->
<line x1="240" y1="436" x2="840" y2="436" stroke="#ff5c00" stroke-width="2.5" opacity="0.6"/>

<!-- Corps du texte -->
<foreignObject x="80" y="460" width="920" height="200">
  <body xmlns="http://www.w3.org/1999/xhtml">
    <p style="font-family:Arial,sans-serif;font-size:30px;color:#ccccdd;text-align:center;line-height:1.6;margin:0">{{BODY}}</p>
  </body>
</foreignObject>

<!-- Boîte stat du jour -->
<rect x="80" y="700" width="920" height="180" rx="20"
  fill="rgba(255,92,0,0.08)" stroke="#ff5c00" stroke-width="2"/>
<text x="540" y="740" font-family="Arial,sans-serif" font-size="18" font-weight="900"
  text-anchor="middle" fill="#ff5c00" letter-spacing="3">📊 STAT DU JOUR</text>
<line x1="200" y1="754" x2="880" y2="754" stroke="#ff5c00" stroke-width="1" opacity="0.3"/>
<text x="540" y="830" font-family="Arial Black,Impact,sans-serif" font-size="54" font-weight="900"
  text-anchor="middle" fill="#f5c842" letter-spacing="1">{{STAT}}</text>

<!-- Hashtags -->
<text x="540" y="950" font-family="Arial,sans-serif" font-size="22" font-weight="600"
  text-anchor="middle" fill="#ff5c00" opacity="0.85">{{HASHTAGS}}</text>

<!-- Baseline -->
<text x="540" y="1020" font-family="Arial,sans-serif" font-size="20"
  text-anchor="middle" fill="#6b6b88">Analyse IA · NBA · WNBA</text>
<text x="540" y="1050" font-family="Arial,sans-serif" font-size="17"
  text-anchor="middle" fill="#444466">hoopiq-zeta.vercel.app</text>
</svg>
