  text-anchor="end" fill="#ccccdd">{{P4_STAT}}</text>

<!-- Rang 5 -->
<rect x="60" y="788" width="960" height="116" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<text x="114" y="864" font-family="Arial Black,Impact,sans-serif" font-size="46" font-weight="900"
  fill="#ccccdd">#5</text>
<text x="210" y="844" font-family="Arial Black,Impact,sans-serif" font-size="34" font-weight="900"
  fill="#f0f0ff">{{P5_NAME}}</text>
<text x="210" y="882" font-family="Arial,sans-serif" font-size="22" fill="#6b6b88">{{P5_TEAM}}  ·  {{P5_POS}}</text>
<text x="960" y="862" font-family="Arial Black,Impact,sans-serif" font-size="40" font-weight="900"
  text-anchor="end" fill="#ccccdd">{{P5_STAT}}</text>

<!-- Ligne + Hashtags -->
<line x1="80" y1="928" x2="1000" y2="928" stroke="#ff5c00" stroke-width="1.5" opacity="0.3"/>
<text x="540" y="970" font-family="Arial,sans-serif" font-size="21" font-weight="600"
  text-anchor="middle" fill="#ff5c00" opacity="0.85">{{HASHTAGS}}</text>
<text x="540" y="1020" font-family="Arial,sans-serif" font-size="18"
  text-anchor="middle" fill="#444466">Classement IA · {{DATE}} · hoopiq_officiel</text>
<text x="540" y="1050" font-family="Arial,sans-serif" font-size="17"
  text-anchor="middle" fill="#333355">hoopiq-zeta.vercel.app</text>
</svg>
