<text x="210" y="308" font-family="Arial Black,Impact,sans-serif" font-size="38" font-weight="900"
  fill="#f0f0ff">{{P1_NAME}}</text>
<text x="210" y="350" font-family="Arial,sans-serif" font-size="24" fill="#6b6b88">{{P1_TEAM}}  ·  {{P1_POS}}</text>
<text x="960" y="330" font-family="Arial Black,Impact,sans-serif" font-size="46" font-weight="900"
  text-anchor="end" fill="#ff5c00">{{P1_STAT}}</text>

<!-- Rang 2 -->
